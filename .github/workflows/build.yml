name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build signed release APK
        run: ./gradlew app:assembleRelease --no-daemon

      - name: Rename APK
        run: |
          VERSION=$(grep versionName app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          cp app/build/outputs/apk/release/app-release.apk zoetrope-v${VERSION}.apk
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Upload artifact (每次构建)
        uses: actions/upload-artifact@v4
        with:
          name: zoetrope-release-apk
          path: zoetrope-v*.apk

      # 推送 v* 标签时自动发布到 Releases 页
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: zoetrope-v*.apk
          generate_release_notes: true
