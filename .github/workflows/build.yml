name: Build APK

permissions:
  contents: write   # 允许发布 Release(默认令牌只读)

# 同 ref 新推送取消仍在排队的旧构建
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ['**']   # 任意分支推送都跑编译验证;打 v* 标签才出 APK
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 普通分支推送 = 纯编译验证(不打包);v* 标签 = 构建签名 APK
      - name: Compile check or Build APK
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ./gradlew app:assembleRelease --no-daemon
          else
            ./gradlew app:compileReleaseKotlin --no-daemon
          fi

      # 以下三步只在标签构建时执行
      - name: Rename APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(grep versionName app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          cp app/build/outputs/apk/release/app-release.apk zoetrope-v${VERSION}.apk

      - name: Upload artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: zoetrope-release-apk
          path: zoetrope-v*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: zoetrope-v*.apk
          generate_release_notes: true
